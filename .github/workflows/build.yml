name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (+ wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust tests (mechanics kit + Minecraft bridge)
        working-directory: rust
        run: cargo test --workspace 2>&1 | tee ../rust-test.log; exit ${PIPESTATUS[0]}

      - name: Build the mechanics as WebAssembly
        working-directory: rust
        run: |
          cargo build -p fn-mc --release --target wasm32-unknown-unknown
          mkdir -p ../src/main/resources/fnmc
          cp target/wasm32-unknown-unknown/release/fn_mc.wasm ../src/main/resources/fnmc/
          ls -l ../src/main/resources/fnmc/fn_mc.wasm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the mod and run the game tests in a 26.3 server
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee gradle.log; exit ${PIPESTATUS[0]}

      - name: Report errors as annotations
        if: failure()
        run: |
          touch gradle.log rust-test.log
          grep -hE "error:|\.java:[0-9]+: |What went wrong|Caused by|Exception|FAILED|failed|assert|Mixin|mixin" gradle.log rust-test.log \
            | grep -v "^\s*at " | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done

      - name: Dump the Minecraft API the mod uses (for fixing names)
        if: always()
        run: |
          mkdir -p /tmp/ci/api
          L=~/.gradle/caches/fabric-loom/${{ '26.3' }}
          JAR="$L/minecraft-common.jar:$L/minecraft-client-only.jar"
          echo "classpath: $JAR" > /tmp/ci/api/_jar.txt
          for c in net.minecraft.world.level.block.Blocks net.minecraft.world.entity.Entity net.minecraft.world.entity.Display 'net.minecraft.world.entity.Display$BlockDisplay' \
                   net.minecraft.world.level.ClipContext net.minecraft.world.level.Level net.minecraft.server.level.ServerLevel net.minecraft.sounds.SoundEvents \
                   net.minecraft.world.entity.EntitySpawnReason net.minecraft.world.entity.EntityTypes net.minecraft.client.KeyMapping net.minecraft.client.Options \
                   net.minecraft.tags.ItemTags net.minecraft.world.level.storage.LevelResource net.minecraft.world.phys.AABB net.minecraft.server.level.ServerPlayer \
                   net.minecraft.world.entity.player.Player net.minecraft.world.level.CollisionGetter net.minecraft.world.level.EntityGetter net.minecraft.core.Direction \
                   net.minecraft.world.phys.BlockHitResult net.minecraft.resources.ResourceKey net.minecraft.commands.CommandSourceStack com.mojang.math.Transformation net.minecraft.client.Minecraft; do
            javap -p -cp "$JAR" "$c" > "/tmp/ci/api/$c.txt" 2>&1 || true
          done
          javap -p -c -cp "$JAR" net.minecraft.world.entity.Entity | grep -n "collide\|getEntityCollisions" > /tmp/ci/api/_entity_collide.txt 2>&1 || true

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp -f gradle.log rust-test.log /tmp/ci/ 2>/dev/null || true
          find . -path ./rust/target -prune -o \( -name "*.log" -path "*run*" \) -print -exec cp --parents {} /tmp/ci/ \; 2>/dev/null || true
          find build -name "*.xml" -path "*test*" -exec cp --parents {} /tmp/ci/ \; 2>/dev/null || true
          cd /tmp/ci
          git init -q -b ci-logs
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logs of ${GITHUB_SHA} run ${GITHUB_RUN_ID}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-logs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fn-mechanics-mc
          path: build/libs/*.jar
          if-no-files-found: ignore
