[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
glam = "0.32.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "webp"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
